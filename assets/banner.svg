<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="border-radius: 12px; overflow: hidden; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#0d1b3a" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(500px); opacity: 0; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .pulse-item {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .scan-line {
        animation: scanBeam 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .flowing-line {
        stroke-dasharray: 8 16;
        animation: flowDash 3s linear infinite;
      }
      .pill-1 { animation: floatSlow1 4.5s ease-in-out infinite; }
      .pill-2 { animation: floatSlow2 5.5s ease-in-out infinite 0.8s; }
      .pill-3 { animation: floatSlow3 5s ease-in-out infinite 1.6s; }
      .pill-4 { animation: floatSlow1 6s ease-in-out infinite 2.2s; }
      .pill-5 { animation: floatSlow2 4.8s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#glow-cyan)" />
  <rect width="1200" height="420" fill="url(#glow-purple)" />
  <rect width="1200" height="420" fill="url(#glow-emerald)" />
  <rect width="1200" height="420" fill="url(#cyber-grid)" />

  <!-- Dynamic Cyber Mesh & Circuit Lines in Background -->
  <g opacity="0.45">
    <!-- Connecting Isolation Flow Lines -->
    <path d="M 100 80 Q 250 140 450 110 T 800 130 T 1100 90" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flowing-line" opacity="0.6" />
    <path d="M 80 340 Q 350 280 600 320 T 950 290 T 1120 330" fill="none" stroke="#a855f7" stroke-width="1.5" class="flowing-line" opacity="0.6" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 20" opacity="0.3" />

    <!-- Ambient Glowing Rings & Hex Vaults -->
    <circle cx="1060" cy="180" r="130" fill="none" stroke="url(#shield-grad)" stroke-width="1.5" stroke-dasharray="10 15" class="pulse-item" opacity="0.4" />
    <polygon points="1060,90 1130,135 1130,225 1060,270 990,225 990,135" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
    <polygon points="1060,110 1110,145 1110,215 1060,250 1010,215 1010,145" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3" />

    <circle cx="140" cy="220" r="90" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 12" class="pulse-item" opacity="0.3" />
  </g>

  <!-- Laser Scanline Animation (Subtle Ambient Sweep) -->
  <g class="scan-line" opacity="0.3">
    <rect x="0" y="0" width="1200" height="2" fill="url(#shield-grad)" filter="url(#glow-filter)" />
  </g>

  <!-- FOREGROUND LAYER: Text & Badges (Completely in foreground, high-contrast, immune to occlusion) -->
  <g id="foreground" filter="url(#shadow-main)">
    
    <!-- Category Super-Header -->
    <g transform="translate(100, 75)">
      <rect x="0" y="0" width="310" height="30" rx="15" fill="#0f172a" stroke="url(#badge-glow)" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#10b981" />
      <text x="32" y="19.5" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE AGENT SECURITY</text>
      <text x="215" y="19.5" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">v2026 ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="150" fill="url(#title-grad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Agent Sandbox
    </text>
    <text x="100" y="200" fill="#ffffff" font-size="40" font-weight="900" letter-spacing="-0.5">
      Security Frameworks <tspan fill="#38bdf8">🛡️</tspan>
    </text>

    <!-- Subtitle / Positioning -->
    <text x="100" y="242" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated Landscape of <tspan fill="#f1f5f9" font-weight="600">MicroVM Runtimes</tspan>, <tspan fill="#f1f5f9" font-weight="600">Syscall Interception</tspan>, &amp; <tspan fill="#f1f5f9" font-weight="600">Deterministic Isolation</tspan>
    </text>

    <!-- Dynamic Tech Pillars (Floating Interactive Cards) -->
    <g transform="translate(100, 280)">
      
      <!-- Pill 1: Firecracker MicroVM -->
      <g class="pill-1" transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#glow-cyan)" opacity="0.3" />
        <text x="16" y="26" font-size="13" font-weight="600" fill="#38bdf8">⚡ MicroVMs (KVM)</text>
      </g>

      <!-- Pill 2: gVisor Syscalls -->
      <g class="pill-2" transform="translate(196, 0)">
        <rect x="0" y="0" width="185" height="42" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="185" height="42" rx="10" fill="url(#glow-purple)" opacity="0.3" />
        <text x="16" y="26" font-size="13" font-weight="600" fill="#c084fc">🛡️ gVisor Interception</text>
      </g>

      <!-- Pill 3: WebAssembly -->
      <g class="pill-3" transform="translate(397, 0)">
        <rect x="0" y="0" width="170" height="42" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="170" height="42" rx="10" fill="url(#glow-emerald)" opacity="0.3" />
        <text x="16" y="26" font-size="13" font-weight="600" fill="#34d399">🔒 Wasm Sandboxes</text>
      </g>

      <!-- Pill 4: Default-Deny Egress -->
      <g class="pill-4" transform="translate(583, 0)">
        <rect x="0" y="0" width="195" height="42" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="195" height="42" rx="10" fill="url(#glow-cyan)" opacity="0.25" />
        <text x="16" y="26" font-size="13" font-weight="600" fill="#67e8f9">🌐 Zero-Trust Egress</text>
      </g>

      <!-- Pill 5: MCP Security -->
      <g class="pill-5" transform="translate(794, 0)">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
        <rect x="0" y="0" width="175" height="42" rx="10" fill="url(#glow-purple)" opacity="0.25" />
        <text x="16" y="26" font-size="13" font-weight="600" fill="#f472b6">🤖 MCP Containment</text>
      </g>

    </g>

    <!-- Bottom Stat Bar -->
    <g transform="translate(100, 360)">
      <line x1="0" y1="0" x2="970" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="24" fill="#64748b" font-size="12" font-weight="500">
        🚀 Defending AI Workloads against Prompt Injection, Rogue Code Execution, Kernel Escapes &amp; Data Exfiltration
      </text>
      <text x="890" y="24" fill="#38bdf8" font-size="12" font-weight="700">★ Open Ecosystem</text>
    </g>

  </g>
</svg>
